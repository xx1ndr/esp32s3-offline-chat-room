; Konfigurasi PlatformIO (opsional). Pengguna Arduino IDE bisa mengabaikan file ini.
; Contoh untuk ESP32-S3 N16R8 (flash 16MB, PSRAM OPI 8MB).
; Library ESP32Async membutuhkan Arduino core 3.x, jadi dipakai platform pioarduino.

[platformio]
src_dir = esp32s3_offline_chat

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
